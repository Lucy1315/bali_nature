<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>BALI 365 overflow check</title>
<style>
  body{margin:16px;font:13px/1.4 system-ui;background:#eee}
  .row{display:flex;gap:16px;align-items:flex-start;overflow-x:auto}
  figure{margin:0;flex:none}
  figcaption{margin-bottom:6px;font-weight:600}
  iframe{border:1px solid #999;background:#fff;height:700px}
  .ok{color:#2a7}.bad{color:#c33}
  pre{background:#fff;padding:8px}
</style></head><body>
<h1>5폭 가로 overflow 점검 (SC-005)</h1>
<pre id="out">측정 중…</pre>
<div class="row" id="row"></div>
<script>
const widths=[320,390,768,1024,1440]; const row=document.getElementById('row'); const out=document.getElementById('out');
const results={};
for (const w of widths){
  const f=document.createElement('figure'); f.innerHTML=`<figcaption>${w}px</figcaption>`;
  const i=document.createElement('iframe'); i.width=w; i.src='../index.html?w='+w; f.append(i); row.append(f);
  i.addEventListener('load',()=>{ setTimeout(()=>{
    const d=i.contentDocument.documentElement;
    const wide=[...i.contentDocument.querySelectorAll('body *')].filter(el=>el.getBoundingClientRect().right>d.clientWidth+1 && getComputedStyle(el).overflowX!=='auto' && !el.closest('.table-scroll, .site-nav__list, .scene__bg')).slice(0,5).map(el=>el.tagName+'.'+(el.className||'').toString().split(' ')[0]);
    results[w]={scrollWidth:d.scrollWidth, clientWidth:d.clientWidth, ok:d.scrollWidth<=d.clientWidth, wide};
    out.textContent=JSON.stringify(results,null,1); window.__results=results;
  },800); });
}
</script></body></html>
